spring.application.name=sales-agent

# Local secrets (OPENAI_API_KEY, OPENAI_MODEL) live in a git-ignored .env next to the pom.
# Real environment variables take precedence; the file is optional so tests run without it.
spring.config.import=optional:file:.env[.properties]

# File-based H2 so conversations survive restarts. PostgreSQL mode keeps the SQL portable.
spring.datasource.url=jdbc:h2:file:./data/sales-agent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Flyway owns the schema; Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
