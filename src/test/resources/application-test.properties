# Tests get a fresh in-memory database per run instead of the developer's ./data file.
spring.datasource.url=jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.h2.console.enabled=false

# Never call OpenAI from the normal test run, even with a key in .env: the stub agent is used.
# The opt-in scenario tests (commit 15) are the only ones that spend tokens.
openai.api-key=
